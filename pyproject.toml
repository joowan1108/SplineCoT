[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-smolvla"
version = "0.1.0"
description = "Standalone knowledge-insulated SmolVLA with spline action reasoning"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.14,<2",
  "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
  "numpy>=2,<2.3",
  "peft>=0.18,<1",
  "scipy>=1.14,<2",
  "torch>=2.7,<2.12",
  "transformers>=5.4,<5.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
libero = ["h5py>=3.11,<4"]

[project.scripts]
ear-train = "ear_smolvla.train:main"
ear-memory-smoke = "ear_smolvla.memory_smoke:main"
ear-train-libero = "ear_smolvla.train_libero:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
